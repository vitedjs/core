name: Pages
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
concurrency:
  group: github-pages
  cancel-in-progress: false
defaults:
  run:
    working-directory: core
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: core
      # @vited/cli and @vited/theme-mantine are linked from sibling directories
      - uses: actions/checkout@v6
        with:
          repository: vitedjs/cli
          path: cli
      - uses: actions/checkout@v6
        with:
          repository: vitedjs/theme-mantine
          path: theme-mantine
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/configure-pages@v5
      - run: pnpm install
        working-directory: cli
      - run: pnpm build
        working-directory: cli
      - run: pnpm install
        working-directory: theme-mantine
      - run: pnpm build
        working-directory: theme-mantine
      - run: pnpm install
      - run: pnpm approve-builds @swc/core esbuild
      - run: pnpm build
      - run: pnpm run docs:build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./core/docs_dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
